[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora: Google ADK exposto por uma API FastAPI."
authors = [
    { name = "pauloguerra83", email = "pauloguerra83@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]==2.9.1",
    "greenlet>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
aurora-api = "aurora.api:main"
aurora-restaurar = "aurora.restaurar:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
